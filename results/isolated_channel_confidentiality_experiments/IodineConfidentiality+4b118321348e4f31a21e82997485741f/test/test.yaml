env: test
conversation_duration: 600
max_start_delay: 900
one_way_availability: 30
analysis_window_size: 600
network:
  minio_net:
    network: minio
    params:
      upstream:
        latency: 0
        loss_profile: none
      downstream:
        latency: 0
        loss_profile: none
  server_net:
    network: server
    params:
      upstream:
        latency: 10
        loss_profile: excellent
      downstream:
        latency: 10
        loss_profile: excellent
  mastodon_net:
    network: mastodon
    params:
      upstream:
        latency: 5
        loss_profile: good
      downstream:
        latency: 5
        loss_profile: good
  dns_net:
    network: dns
    params:
      upstream:
        latency: 20
        loss_profile: good
      downstream:
        latency: 20
        loss_profile: good
  client_net_mastodon:
    nat: false
    network: client
    params:
      upstream:
        latency: 20
        loss_profile: excellent
      downstream:
        latency: 20
        loss_profile: excellent
  client_net_obfs:
    nat: false
    network: client
    params:
      upstream:
        latency: 15
        loss_profile: none
      downstream:
        latency: 15
        loss_profile: none
  client_net_iodine:
    nat: false
    network: client
    params:
      upstream:
        latency: 10
        loss_profile: none
      downstream:
        latency: 10
        loss_profile: none
  client_net_sky:
    nat: false
    network: client
    params:
      upstream:
        latency: 20
        loss_profile: none
      downstream:
        latency: 20
        loss_profile: none
  client_net_racetunnel:
    nat: false
    network: client
    params:
      upstream:
        latency: 30
        loss_profile: none
      downstream:
        latency: 30
        loss_profile: none
nodes:
  node_type_iodine:
    channel_config:
    - direction: bidirectional
      channel: iodine
      vars:
        client:
          max_response_size: 202
          max_query_length: 102
    client_per_network:
      client_net_iodine:
        quantity: 2
        profiles:
          irc_casualchat: 1
tgen:
  tgen_type_dns:
    tgen_per_network:
      client_net_iodine:
        quantity: 12
        profiles:
          fast_3: 0.33
          normal_3: 0.33
          slow_3: 0.34
