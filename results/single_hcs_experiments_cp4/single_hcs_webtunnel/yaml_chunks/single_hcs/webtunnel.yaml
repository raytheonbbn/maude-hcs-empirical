env: single_tgen_ftp_webtunnel
conversation_duration: 600
max_start_delay: 900
one_way_availability: 30
analysis_window_size: 600

network:
  server_net:
    network: server
    params:
      upstream:
        latency: 10
        loss_profile: "excellent"
      downstream:
        latency: 10
        loss_profile: "excellent"
  dns_net:
    network: dns
    params:
      upstream:
        latency: 20
        loss_profile: "good"
      downstream:
        latency: 20
        loss_profile: "good"
  client_net_racetunnel:
    nat: false
    network: client
    params:
      upstream:
        latency: 30
        loss_profile: "none"
      downstream:
        latency: 30
        loss_profile: "none"
        
nodes:
  node_type_racetunnel:
    channel_config:
      - direction: bidirectional
        channel: racetunnel
        vars:
          client:
            user_model: ""
          server:
            user_model: ""
    client_per_network:
      client_net_racetunnel:
        quantity: 2
        profiles:
          irc_casualchat: 1