env: single_hcs_obfs
conversation_duration: 600
max_start_delay: 120
one_way_availability: 30
analysis_window_size: 600
network:
  server_net:
    network: server
    params:
      upstream:
        latency: 10
        loss_profile: single_hcs_obfs_excellent
      downstream:
        latency: 10
        loss_profile: single_hcs_obfs_excellent
  dns_net:
    network: dns
    params:
      upstream:
        latency: 20
        loss_profile: single_hcs_obfs_good
      downstream:
        latency: 20
        loss_profile: single_hcs_obfs_good
  client_net_obfs:
    nat: false
    network: client
    params:
      upstream:
        latency: 15
        loss_profile: single_hcs_obfs_none
      downstream:
        latency: 15
        loss_profile: single_hcs_obfs_none
  minio_net:
    network: minio
    params:
      upstream:
        latency: 0
        loss_profile: single_hcs_obfs_none
      downstream:
        latency: 0
        loss_profile: single_hcs_obfs_none
  mastodon_net:
    network: mastodon
    params:
      upstream:
        latency: 5
        loss_profile: single_hcs_obfs_good
      downstream:
        latency: 5
        loss_profile: single_hcs_obfs_good
nodes:
  node_type_obfs:
    channel_config:
    - direction: bidirectional
      channel: obfs
      vars:
        client:
          iat: '0'
        server:
          iat: '0'
    client_per_network:
      client_net_obfs:
        quantity: 2
        profiles:
          single_hcs_obfs_irc_casualchat: 1
