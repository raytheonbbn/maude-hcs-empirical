env: single_hcs_mastodon
conversation_duration: 600
max_start_delay: 120
one_way_availability: 30
analysis_window_size: 600
network:
  server_net:
    network: server
    params:
      upstream:
        latency: 10
        loss_profile: single_hcs_mastodon_excellent
      downstream:
        latency: 10
        loss_profile: single_hcs_mastodon_excellent
  dns_net:
    network: dns
    params:
      upstream:
        latency: 20
        loss_profile: single_hcs_mastodon_good
      downstream:
        latency: 20
        loss_profile: single_hcs_mastodon_good
  mastodon_net:
    network: mastodon
    params:
      upstream:
        latency: 5
        loss_profile: single_hcs_mastodon_good
      downstream:
        latency: 5
        loss_profile: single_hcs_mastodon_good
  client_net_mastodon:
    nat: false
    network: client
    params:
      upstream:
        latency: 20
        loss_profile: single_hcs_mastodon_excellent
      downstream:
        latency: 20
        loss_profile: single_hcs_mastodon_excellent
  minio_net:
    network: minio
    params:
      upstream:
        latency: 0
        loss_profile: single_hcs_mastodon_none
      downstream:
        latency: 0
        loss_profile: single_hcs_mastodon_none
nodes:
  node_type_mastodon:
    channel_config:
    - direction: bidirectional
      channel: mastodon
      vars:
        client:
          user_model: single_hcs_mastodon_mastodon_client_scenario_2.json
        server:
          user_model: single_hcs_mastodon_mastodon_server_scenario_2.json
    client_per_network:
      client_net_mastodon:
        quantity: 2
        profiles:
          single_hcs_mastodon_irc_casualchat: 1
